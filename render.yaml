# Render Blueprint for the full PolyMod build.
# The lite build has its own repo (kalacs8706/pserver) and its own blueprint.
services:
  - type: web
    name: polytrack
    runtime: static
    staticPublishPath: ./web
    headers:
      - path: /*.wasm
        name: Content-Type
        value: application/wasm
      - path: /**/*.wasm
        name: Content-Type
        value: application/wasm
